name: Build KAGE Focus APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/kage-source
          mkdir -p /tmp/kage-source app/src/main/assets app/src/main/java/com/kage/focus app/src/main/res/drawable-nodpi app/src/main/res/values

          unzip -q kage-elite-academy-app.zip -d /tmp/kage-source

          # Locate the web app regardless of the ZIP's top-level folder name.
          INDEX_DIR="$(dirname "$(find /tmp/kage-source -type f -name index.html -print -quit)")"
          if [ -z "$INDEX_DIR" ] || [ "$INDEX_DIR" = "." ]; then
            echo "index.html was not found in the uploaded ZIP"
            find /tmp/kage-source -maxdepth 3 -type f | head -100
            exit 1
          fi
          cp -R "$INDEX_DIR"/. app/src/main/assets/

          # Use the supplied KAGE icon from the project ZIP when present.
          ICON="$(find /tmp/kage-source -type f \( -iname 'kage-launcher.png' -o -iname '*kage*.png' -o -iname '*icon*.png' -o -iname '*logo*.png' \) -print -quit)"
          if [ -n "$ICON" ]; then
            cp "$ICON" app/src/main/res/drawable-nodpi/kage_launcher.png
          else
            # Valid fallback icon if the ZIP has no raster icon.
            cat > app/src/main/res/drawable/kage_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#07140B" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#39FF88" android:pathData="M16,16h76v76h-76zM22,22v64h64v-64z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M28,32h9v44h-9zM37,50l28,-18h14L51,52l29,24H66L37,54z"/>
          </vector>
          EOF
          fi

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'KageFocus'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }

          android {
              namespace 'com.kage.focus'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.kage.focus'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      shrinkResources false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/proguard-rules.pro <<'EOF'
          # No custom shrinking rules.
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#39ff88</item>
                  <item name="android:navigationBarColor">#080808</item>
                  <item name="android:statusBarColor">#080808</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:icon="@drawable/kage_launcher"
                  android:label="KAGE Focus"
                  android:resizeableActivity="true"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">
                  <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/kage/focus/MainActivity.java <<'EOF'
          package com.kage.focus;

          import android.Manifest;
          import android.app.Activity;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;
              private static final int AUDIO_REQUEST = 42;

              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override public void onPermissionRequest(final PermissionRequest request) {
                          runOnUiThread(() -> {
                              if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                                  request.deny();
                                  requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, AUDIO_REQUEST);
                              } else request.grant(request.getResources());
                          });
                      }
                  });
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED)
                      requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, AUDIO_REQUEST);
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override public void onBackPressed() {
                  if (webView.canGoBack()) webView.goBack(); else super.onBackPressed();
              }

              @Override protected void onDestroy() {
                  if (webView != null) webView.destroy();
                  super.onDestroy();
              }
          }
          EOF

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KAGE-Focus-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
