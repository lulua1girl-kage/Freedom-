name: Build KAGE Focus APK Fixed
on:
  push:
    branches: [ main ]
  workflow_dispatch:
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/kage-source
          mkdir -p /tmp/kage-source app/src/main/assets app/src/main/java/com/kage/focus app/src/main/res/drawable-nodpi app/src/main/res/drawable app/src/main/res/values app/src/main/res/xml
          unzip -q kage-elite-academy-app.zip -d /tmp/kage-source
          INDEX_DIR="$(dirname "$(find /tmp/kage-source -type f -name index.html -print -quit)")"
          APP_JS="$(find /tmp/kage-source -type f -name app.js -print -quit)"
          test -n "$INDEX_DIR" -a -n "$APP_JS"
          python3 scripts/patch_app.py "$APP_JS"
          cp -R "$INDEX_DIR"/. app/src/main/assets/
          cp native/*.java app/src/main/java/com/kage/focus/
          cp native/accessibility_service_config.xml app/src/main/res/xml/
          if [ -f branding/kage_focus_icon.jpg ]; then
            cp branding/kage_focus_icon.jpg app/src/main/res/drawable-nodpi/kage_launcher.jpg
            ICON_EXT="jpg"
          else
            ICON="$(find /tmp/kage-source -type f \( -iname 'kage-launcher.png' -o -iname '*kage*.png' -o -iname '*icon*.png' -o -iname '*logo*.png' \) -print -quit)"
            if [ -n "$ICON" ]; then cp "$ICON" app/src/main/res/drawable-nodpi/kage_launcher.png; ICON_EXT="png"; else ICON_EXT="vector"; fi
          fi
          if [ "$ICON_EXT" != "vector" ]; then :; else cat > app/src/main/res/drawable/kage_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#07140B" android:pathData="M0,0h108v108h-108z"/><path android:fillColor="#39FF88" android:pathData="M16,16h76v76h-76zM22,22v64h64v-64z"/><path android:fillColor="#FFFFFF" android:pathData="M28,32h9v44h-9zM37,50l28,-18h14L51,52l29,24H66L37,54z"/></vector>
          EOF
          fi
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='KageFocus'; include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android { namespace 'com.kage.focus'; compileSdk 35
            defaultConfig { applicationId 'com.kage.focus'; minSdk 23; targetSdk 35; versionCode 2; versionName '1.1' }
            buildTypes { release { minifyEnabled false; shrinkResources false } }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          EOF
          cat > app/proguard-rules.pro <<'EOF'
          EOF
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar"><item name="android:fontFamily">sans</item><item name="android:colorAccent">#39ff88</item><item name="android:navigationBarColor">#080808</item><item name="android:statusBarColor">#080808</item><item name="android:windowLightStatusBar">false</item></style></resources>
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.RECORD_AUDIO"/>
            <application android:allowBackup="true" android:hardwareAccelerated="true" android:icon="@drawable/kage_launcher" android:label="KAGE Focus" android:theme="@style/AppTheme">
              <activity android:name=".BlockedActivity" android:exported="false" android:excludeFromRecents="true" android:launchMode="singleTop"/>
              <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>
              <service android:name=".KageBlockerService" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE" android:exported="true"><intent-filter><action android:name="android.accessibilityservice.AccessibilityService"/></intent-filter><meta-data android:name="android.accessibilityservice" android:resource="@xml/accessibility_service_config"/></service>
            </application>
          </manifest>
          EOF
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KAGE-Focus-blocker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
